<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemeindeflagge – BFS-Nummer</title>
<style>
  :root {
    --ink: #1c1c1c;
    --paper: #fafaf8;
    --line: #d8d6cf;
    --accent: #b5121b; /* Schweizer Rot */
    --muted: #6b6b66;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    background: var(--paper);
    color: var(--ink);
    font-family: "Iowan Old Style", "Georgia", serif;
    padding: 2rem 1rem;
    text-align: center;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
  }
  .bfs {
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .frame {
    border: 1px solid var(--line);
    background: #fff;
    padding: 1.5rem;
    min-width: 300px;
    min-height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  img {
    max-width: 300px;
    width: 100%;
    height: auto;
    display: block;
  }
  .status {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .status.error { color: var(--accent); }
  input[type="text"] {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.95rem;
    padding: 0.5rem 0.75rem;
    border: 1px solid var(--line);
    border-radius: 4px;
    width: 8rem;
    text-align: center;
  }
  form {
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }
  button {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.9rem;
    padding: 0.5rem 1rem;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover { opacity: 0.85; }
  .tariffs {
    width: 100%;
    max-width: 480px;
    border: 1px solid var(--line);
    background: #fff;
    padding: 1.25rem 1.5rem;
    min-height: 3rem;
  }
  .tariffs h2 {
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 0.9rem 0;
    text-align: left;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.9rem;
  }
  th, td {
    text-align: left;
    padding: 0.4rem 0.5rem;
    border-bottom: 1px solid var(--line);
  }
  th {
    font-weight: 600;
    color: var(--muted);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  td.tarif {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

  <h1>Gemeindeflagge <span class="bfs" id="bfsLabel"></span></h1>

  <div class="frame" id="frame">
    <span class="status" id="status">Lade …</span>
  </div>

  <div class="tariffs" id="tariffs">
    <h2>Stromtarife (Kategorie H4, 2026)</h2>
    <span class="status" id="tariffStatus">Lade …</span>
  </div>

  <form id="bfsForm">
    <input type="text" id="bfsInput" placeholder="BFS-Nr., z. B. 351" inputmode="numeric">
    <button type="submit">Anzeigen</button>
  </form>

  <script>
    const endpoint = "https://query.wikidata.org/sparql";
    const elcomEndpoint = "https://ld.admin.ch/query";

    function getBfsFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("bfs");
    }

    function buildQuery(bfsNr) {
      return `SELECT ?flag WHERE {
  ?muni wdt:P771 "${bfsNr}" ;
        wdt:P41 ?flag .
} LIMIT 1`;
    }

    function buildTariffQuery(bfsNr) {
      return `PREFIX schema: <http://schema.org/>
PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
SELECT ?Betreiber ?Tarif WHERE {
	?obs <https://energy.ld.admin.ch/elcom/electricityprice/dimension/period> "2026"^^xsd:gYear;
      <https://energy.ld.admin.ch/elcom/electricityprice/dimension/municipality> <https://ld.admin.ch/municipality/${bfsNr}> ;
      <https://energy.ld.admin.ch/elcom/electricityprice/dimension/category> <https://energy.ld.admin.ch/elcom/electricityprice/category/H4> ;
      <https://energy.ld.admin.ch/elcom/electricityprice/dimension/product> <https://energy.ld.admin.ch/elcom/electricityprice/product/standard> ;
      <https://energy.ld.admin.ch/elcom/electricityprice/dimension/operator>/schema:name ?Betreiber ;
      <https://energy.ld.admin.ch/elcom/electricityprice/dimension/total> ?Tarif .
}
ORDER BY ?Betreiber`;
    }

    async function loadTariffs(bfsNr) {
      const container = document.getElementById("tariffs");

      if (!bfsNr) {
        container.innerHTML = '<h2>Stromtarife (Kategorie H4, 2026)</h2><span class="status">Warte auf BFS-Nummer …</span>';
        return;
      }

      container.innerHTML = '<h2>Stromtarife (Kategorie H4, 2026)</h2><span class="status" id="tariffStatus">Lade …</span>';

      const url = elcomEndpoint + "?query=" + encodeURIComponent(buildTariffQuery(bfsNr)) + "&format=json";

      try {
        const res = await fetch(url, {
          headers: { "Accept": "application/sparql-results+json" }
        });
        if (!res.ok) throw new Error("Elcom-Anfrage fehlgeschlagen (" + res.status + ")");

        const data = await res.json();
        const bindings = data.results.bindings;

        if (bindings.length === 0) {
          container.innerHTML = '<h2>Stromtarife (Kategorie H4, 2026)</h2><span class="status error">Keine Tarifdaten für BFS-Nr. ' + bfsNr + ' gefunden.</span>';
          return;
        }

        const rows = bindings.map(b => {
          const betreiber = b.Betreiber.value;
          const tarif = parseFloat(b.Tarif.value).toFixed(2);
          return `<tr><td>${betreiber}</td><td class="tarif">${tarif} Rp./kWh</td></tr>`;
        }).join("");

        container.innerHTML = `
          <h2>Stromtarife (Kategorie H4, 2026)</h2>
          <table>
            <thead><tr><th>Betreiber</th><th>Tarif</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>`;

      } catch (err) {
        container.innerHTML = '<h2>Stromtarife (Kategorie H4, 2026)</h2><span class="status error">Fehler: ' + err.message + '</span>';
      }
    }

    async function loadFlag(bfsNr) {
      const frame = document.getElementById("frame");
      const label = document.getElementById("bfsLabel");
      label.textContent = bfsNr ? `(BFS-Nr. ${bfsNr})` : "";

      if (!bfsNr) {
        frame.innerHTML = '<span class="status">Bitte BFS-Nummer als URL-Parameter <code>?bfs=</code> angeben oder unten eingeben.</span>';
        return;
      }

      frame.innerHTML = '<span class="status">Lade …</span>';

      const url = endpoint + "?query=" + encodeURIComponent(buildQuery(bfsNr)) + "&format=json";

      try {
        const res = await fetch(url, {
          headers: { "Accept": "application/sparql-results+json" }
        });
        if (!res.ok) throw new Error("Wikidata-Anfrage fehlgeschlagen (" + res.status + ")");

        const data = await res.json();
        const bindings = data.results.bindings;

        if (bindings.length === 0) {
          frame.innerHTML = '<span class="status error">Keine Flagge für BFS-Nr. ' + bfsNr + ' gefunden.</span>';
          return;
        }

        const flagUrl = bindings[0].flag.value;
        const thumbUrl = flagUrl + "?width=300";

        frame.innerHTML = "";
        const img = document.createElement("img");
        img.src = thumbUrl;
        img.alt = "Flagge der Gemeinde (BFS-Nr. " + bfsNr + ")";
        img.onerror = () => {
          frame.innerHTML = '<span class="status error">Flagge konnte nicht geladen werden.</span>';
        };
        frame.appendChild(img);

      } catch (err) {
        frame.innerHTML = '<span class="status error">Fehler: ' + err.message + '</span>';
      }
    }

    document.getElementById("bfsForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const val = document.getElementById("bfsInput").value.trim();
      if (val) {
        const newUrl = window.location.pathname + "?bfs=" + encodeURIComponent(val);
        window.history.pushState({}, "", newUrl);
        loadFlag(val);
        loadTariffs(val);
      }
    });

    // Initial load
    const initialBfs = getBfsFromUrl();
    if (initialBfs) document.getElementById("bfsInput").value = initialBfs;
    loadFlag(initialBfs);
    loadTariffs(initialBfs);
  </script>

</body>
</html>
